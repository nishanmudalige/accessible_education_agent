<div class="reader-page-actions">
  <button id="reader-highlight-toggle" type="button" aria-pressed="true" data-en="Hide highlights" data-fr="Masquer le surlignage">Hide highlights</button>
  <button id="reader-read-highlights" type="button" disabled data-en="▶ Read highlights" data-fr="▶ Lire les passages surlignés">▶ Read highlights</button>
  <button id="read-page" type="button" class="speech-launch" data-en="▶ Read aloud" data-fr="▶ Lire à voix haute">▶ Read aloud</button>
  {% if pdf_reader %}<button id="reader-text-toggle" type="button" aria-pressed="false" data-en="Show page text" data-fr="Afficher le texte">Show page text</button>{% endif %}
  <button id="translate-page" type="button" data-en="Translate page" data-fr="Traduire la page">Translate page</button>
  <button id="reader-copy" type="button" data-en="Copy page link" data-fr="Copier le lien">Copy page link</button>
</div>
